name: Import ALTIMA Canva slide images

on:
  push:
    paths:
      - '.github/workflows/import-altima-canva.yml'

permissions:
  contents: write

jobs:
  import-canva:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repository
        uses: actions/checkout@v4
      - name: Save final 11 Canva slides as permanent website images
