      - name: Commit local images for stable website URLs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/canva
          if git diff --cached --quiet; then
            echo "Images already present"
            exit 0
          fi
          git commit -m "Store 11 final Canva slide images for ALTIMA website"
